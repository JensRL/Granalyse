# Granalyse run configuration
#
# Run with:  granalyse run example_config.yaml

output_dir: ./examples/example_results

# Background models to fit: D/J/H/T or aliases harvey1/hybrid/harvey2/harvey3.
# Radius inference uses the models with derived relations (J, H, T).
# Recommended default: J, H and T
models: [J, H, T]

pulsation_model: Gaussian      # Gaussian (default) or Peakbogging
correlated_inference: true     # granulation params via Kallinger scaling + scatter

binning:
  enabled: true
  resolution: 0.5              # target bin resolution [muHz]
  visual_bins: 10              # plot-only binning; used for visualization when binning.enabled is false

low_frequency_cut: 10          # discard frequencies below this [muHz]; null to keep

sampling:
  nlive_factor: null           # multiply default nlive (4*50*ndims); null = default
  seed: null                   # RNG seed for reproducible sampling 

radius_inference: true         # requires teff (and ideally feh) per star

skip_replot: false             # on resume, reuse existing figures instead of
                               # remaking them (much faster for stopped runs)

stars:
  # Give numax directly...
  - name: KIC8006161
    pds_file: examples/example_data/kplr008006161_kasoc-psd_slc_v1.pow
    numax: 3575
    teff: 5488
    teff_err: 77
    feh: 0.34
    feh_err: 0.1
    mission: Kepler

  # ...or give logg + teff and let the numax scaling relation estimate it.
  # Simulations (kind: simulation) skip the instrumental-systematics masking.
  # - name: SimulationExample
  #   pds_file: examples/data/simulated_spectrum.pow
  #   kind: simulation
  #   logg: 4.44
  #   teff: 5777
